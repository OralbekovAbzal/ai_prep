services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: 
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:pass@db:5432/postgres

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: